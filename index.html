<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Histoire Brevet - 1ère GM et Entre-deux-guerres</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #1F4788;
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 18px;
        }

        .theme-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 30px;
            justify-content: center;
        }

        .theme-btn {
            padding: 12px 24px;
            background: #f0f0f0;
            border: 2px solid #ddd;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
            font-weight: bold;
        }

        .theme-btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .theme-btn.active {
            background: #1F4788;
            color: white;
            border-color: #1F4788;
        }

        .start-screen, .quiz-screen, .results-screen {
            display: none;
        }

        .start-screen.active, .quiz-screen.active, .results-screen.active {
            display: block;
        }

        .start-btn, .restart-btn, .next-btn, .submit-btn {
            display: block;
            margin: 30px auto 0;
            padding: 15px 40px;
            background: #1F4788;
            color: white;
            border: none;
            border-radius: 30px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .start-btn:hover, .restart-btn:hover, .next-btn:hover, .submit-btn:hover {
            background: #2E5C8A;
            transform: scale(1.05);
        }

        .question-card {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        .question-number {
            color: #C00000;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .question-text {
            font-size: 20px;
            color: #333;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            padding: 15px 20px;
            background: white;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }

        .option:hover {
            background: #f0f0f0;
            border-color: #1F4788;
        }

        .option.selected {
            background: #e3f2fd;
            border-color: #1F4788;
        }

        .option.correct {
            background: #c8e6c9;
            border-color: #4caf50;
        }

        .option.incorrect {
            background: #ffcdd2;
            border-color: #f44336;
        }

        .input-answer {
            width: 100%;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        .input-answer:focus {
            outline: none;
            border-color: #1F4788;
        }

        .explanation {
            margin-top: 20px;
            padding: 15px;
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            border-radius: 5px;
            display: none;
        }

        .explanation.show {
            display: block;
        }

        .explanation-title {
            font-weight: bold;
            color: #856404;
            margin-bottom: 5px;
        }

        .explanation-text {
            color: #856404;
            line-height: 1.5;
        }

        .progress {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 15px;
            background: #f0f0f0;
            border-radius: 10px;
        }

        .progress-text {
            font-weight: bold;
            color: #1F4788;
        }

        .progress-bar {
            flex: 1;
            margin: 0 20px;
            height: 10px;
            background: #ddd;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.3s;
        }

        .score-display {
            text-align: center;
            margin: 30px 0;
        }

        .score-circle {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            color: white;
        }

        .score-excellent {
            background: linear-gradient(135deg, #4caf50 0%, #8bc34a 100%);
        }

        .score-good {
            background: linear-gradient(135deg, #2196f3 0%, #03a9f4 100%);
        }

        .score-average {
            background: linear-gradient(135deg, #ff9800 0%, #ffc107 100%);
        }

        .score-low {
            background: linear-gradient(135deg, #f44336 0%, #e91e63 100%);
        }

        .score-text {
            font-size: 24px;
            color: #333;
            margin-bottom: 10px;
        }

        .score-message {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }

        .review-section {
            margin-top: 30px;
        }

        .review-item {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .review-question {
            font-weight: bold;
            color: #1F4788;
            margin-bottom: 10px;
        }

        .review-answer {
            margin-bottom: 5px;
        }

        .review-correct {
            color: #4caf50;
        }

        .review-incorrect {
            color: #f44336;
        }

        @media (max-width: 600px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            .question-text {
                font-size: 18px;
            }

            .theme-selector {
                flex-direction: column;
            }

            .theme-btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎓 Quiz Histoire - Brevet</h1>
        <p class="subtitle">1ère Guerre Mondiale et Entre-deux-guerres</p>

        <!-- Écran de démarrage -->
        <div class="start-screen active">
            <h2 style="text-align: center; color: #2E5C8A; margin-bottom: 20px;">Choisis tes thèmes de révision</h2>
            <div class="theme-selector" id="themeSelector">
                <button class="theme-btn" data-theme="all">Tous les thèmes</button>
                <button class="theme-btn" data-theme="1gm">1ère Guerre Mondiale</button>
                <button class="theme-btn" data-theme="chrono">Chronologie</button>
                <button class="theme-btn" data-theme="vocabulaire">Vocabulaire</button>
                <button class="theme-btn" data-theme="genocide">Génocide arménien</button>
                <button class="theme-btn" data-theme="urss">URSS et Staline</button>
                <button class="theme-btn" data-theme="allemagne">Allemagne nazie</button>
                <button class="theme-btn" data-theme="crise">Grande Dépression</button>
                <button class="theme-btn" data-theme="france">Front Populaire</button>
                <button class="theme-btn" data-theme="italie">Italie fasciste</button>
                <button class="theme-btn" data-theme="perils">Montée des périls</button>
            </div>
            <button class="start-btn" onclick="startQuiz()">Commencer le Quiz</button>
        </div>

        <!-- Écran du quiz -->
        <div class="quiz-screen">
            <div class="progress">
                <span class="progress-text" id="progressText">Question 1/20</span>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 5%"></div>
                </div>
                <span class="progress-text" id="scoreText">Score: 0/0</span>
            </div>

            <div class="question-card" id="questionCard">
                <!-- Questions générées dynamiquement -->
            </div>

            <button class="next-btn" id="nextBtn" onclick="nextQuestion()" style="display: none;">Question suivante</button>
            <button class="submit-btn" id="submitBtn" onclick="submitAnswer()" style="display: none;">Valider</button>
        </div>

        <!-- Écran des résultats -->
        <div class="results-screen">
            <div class="score-display">
                <div class="score-circle" id="scoreCircle">0%</div>
                <div class="score-text" id="scoreTextResult">Score: 0/0</div>
                <div class="score-message" id="scoreMessage"></div>
            </div>

            <div class="review-section" id="reviewSection">
                <!-- Révision des réponses -->
            </div>

            <button class="restart-btn" onclick="restartQuiz()">Recommencer</button>
        </div>
    </div>

    <script>
        const questions = [
            // 1ère Guerre Mondiale
            {
                theme: "1gm",
                type: "mcq",
                question: "Quel événement a déclenché la Première Guerre Mondiale ?",
                options: [
                    "L'invasion de la Belgique par l'Allemagne",
                    "L'assassinat de l'archiduc François-Ferdinand à Sarajevo",
                    "La déclaration de guerre de la France à l'Allemagne",
                    "L'attaque de la Russie contre l'Autriche-Hongrie"
                ],
                correct: 1,
                explanation: "L'assassinat de l'archiduc François-Ferdinand, héritier de l'empire austro-hongrois, le 28 juin 1914 à Sarajevo a déclenché le jeu des alliances qui a entraîné l'Europe dans la guerre."
            },
            {
                theme: "1gm",
                type: "mcq",
                question: "Quels pays formaient la Triple Entente ?",
                options: [
                    "France, Royaume-Uni, Italie",
                    "Allemagne, Autriche-Hongrie, Italie",
                    "France, Royaume-Uni, Russie",
                    "France, Allemagne, Russie"
                ],
                correct: 2,
                explanation: "La Triple Entente (1907) unissait la France, le Royaume-Uni et la Russie contre la Triple Alliance (Allemagne, Autriche-Hongrie, Italie)."
            },
            {
                theme: "1gm",
                type: "tf",
                question: "La guerre des tranchées est aussi appelée guerre de position.",
                correct: true,
                explanation: "Oui, la guerre des tranchées (de fin 1914 à 1918) est aussi appelée guerre de position car le front se stabilise et les armées s'enterrent dans des tranchées."
            },
            {
                theme: "vocabulaire",
                type: "input",
                question: "Comment appelle-t-on la suspension provisoire des combats en attendant un traité de paix ?",
                correct: ["armistice"],
                explanation: "Un armistice est une suspension provisoire des combats. L'armistice du 11 novembre 1918 a mis fin aux combats de la Première Guerre Mondiale."
            },

            // Chronologie
            {
                theme: "chrono",
                type: "mcq",
                question: "En quelle année l'armistice de la Première Guerre Mondiale a-t-il été signé ?",
                options: ["1917", "1918", "1919", "1920"],
                correct: 1,
                explanation: "L'armistice a été signé le 11 novembre 1918 à Rethondes, mettant fin aux combats de la Première Guerre Mondiale."
            },
            {
                theme: "chrono",
                type: "mcq",
                question: "Quelle bataille de 1916 est devenue le symbole de la violence de la guerre ?",
                options: [
                    "Bataille de la Marne",
                    "Bataille de Verdun",
                    "Bataille de la Somme",
                    "Bataille de Tannenberg"
                ],
                correct: 1,
                explanation: "La bataille de Verdun (février-décembre 1916) a fait 700 000 morts et blessés et est devenue le symbole de la violence et de l'absurdité de la guerre."
            },
            {
                theme: "chrono",
                type: "tf",
                question: "Les États-Unis sont entrés en guerre dès 1914.",
                correct: false,
                explanation: "Faux. Les États-Unis sont entrés en guerre en avril 1917, trois ans après le début du conflit."
            },

            // Vocabulaire
            {
                theme: "vocabulaire",
                type: "mcq",
                question: "Qu'est-ce qu'un belligérant ?",
                options: [
                    "Un soldat blessé au combat",
                    "Un pays en guerre",
                    "Un chef militaire",
                    "Un objectif militaire"
                ],
                correct: 1,
                explanation: "Un belligérant est un pays qui participe à une guerre. En 1914-1918, on distinguait les Alliés et les Empires centraux."
            },
            {
                theme: "vocabulaire",
                type: "input",
                question: "Comment appelle-t-on la ligne de combat où s'affrontent les armées ennemies ?",
                correct: ["front", "le front"],
                explanation: "Le front est la ligne de combat où s'affrontent les armées. Le front occidental s'étendait de la mer du Nord à la Suisse."
            },

            // Génocide arménien
            {
                theme: "genocide",
                type: "mcq",
                question: "Quel empire a commis le génocide arménien ?",
                options: [
                    "L'Empire russe",
                    "L'Empire austro-hongrois",
                    "L'Empire ottoman",
                    "L'Empire allemand"
                ],
                correct: 2,
                explanation: "Le génocide arménien a été commis par l'Empire ottoman à partir de 1915, faisant entre 1,2 et 1,5 million de victimes."
            },
            {
                theme: "genocide",
                type: "tf",
                question: "Le génocide arménien a commencé en 1915.",
                correct: true,
                explanation: "Vrai. Le génocide arménien a débuté le 24 avril 1915 avec l'arrestation et l'exécution de l'élite arménienne de Constantinople."
            },
            {
                theme: "genocide",
                type: "input",
                question: "Quel terme désigne l'extermination systématique et planifiée d'un groupe humain ?",
                correct: ["génocide", "genocide"],
                explanation: "Un génocide est l'extermination systématique et planifiée d'un groupe humain en raison de son appartenance ethnique, religieuse ou raciale."
            },

            // URSS et Staline
            {
                theme: "urss",
                type: "mcq",
                question: "En quelle année l'URSS a-t-elle été créée ?",
                options: ["1917", "1919", "1922", "1924"],
                correct: 2,
                explanation: "L'URSS (Union des Républiques Socialistes Soviétiques) a été créée en 1922, après la victoire des bolcheviks dans la guerre civile."
            },
            {
                theme: "urss",
                type: "mcq",
                question: "Qu'est-ce qu'un kolkhoze ?",
                options: [
                    "Un camp de travail forcé",
                    "Une ferme collective",
                    "Une usine d'État",
                    "Un parti politique"
                ],
                correct: 1,
                explanation: "Un kolkhoze est une ferme collective où les paysans travaillent ensemble et partagent les récoltes, dans le cadre de la collectivisation stalinienne."
            },
            {
                theme: "urss",
                type: "tf",
                question: "Lénine est mort en 1924.",
                correct: true,
                explanation: "Vrai. Lénine est mort en 1924, et Staline a progressivement pris le pouvoir pour devenir le maître absolu de l'URSS à partir de 1928."
            },
            {
                theme: "urss",
                type: "input",
                question: "Comment appelle-t-on les plans économiques sur 5 ans fixant les objectifs de production ?",
                correct: ["plan quinquennal", "plans quinquennaux"],
                explanation: "Les plans quinquennaux sont des plans économiques sur 5 ans. Le premier (1928-1932) visait à développer l'industrie lourde."
            },

            // Allemagne nazie
            {
                theme: "allemagne",
                type: "mcq",
                question: "En quelle année Hitler est-il devenu chancelier d'Allemagne ?",
                options: ["1930", "1932", "1933", "1934"],
                correct: 2,
                explanation: "Hitler a été nommé chancelier le 30 janvier 1933 par le président Hindenburg."
            },
            {
                theme: "allemagne",
                type: "mcq",
                question: "Quel était le nom du régime démocratique allemand après 1919 ?",
                options: [
                    "République de Berlin",
                    "République de Weimar",
                    "Empire allemand",
                    "Reich démocratique"
                ],
                correct: 1,
                explanation: "La République de Weimar (1919-1933) était le régime démocratique allemand, souvent contesté et affaibli par les crises."
            },
            {
                theme: "allemagne",
                type: "tf",
                question: "La Nuit de Cristal était un pogrom contre les Juifs en 1938.",
                correct: true,
                explanation: "Vrai. La Nuit de Cristal (9-10 novembre 1938) était un pogrom violent contre les Juifs : synagogues incendiées, magasins détruits, arrestations."
            },
            {
                theme: "allemagne",
                type: "input",
                question: "Comment Hitler se faisait-il appeler (titre signifiant 'le guide') ?",
                correct: ["führer", "fuhrer", "le führer", "le fuhrer"],
                explanation: "Hitler portait le titre de Führer (le guide), concentrant tous les pouvoirs après la mort du président Hindenburg en 1934."
            },

            // Grande Dépression
            {
                theme: "crise",
                type: "mcq",
                question: "Quel jour a eu lieu le krach boursier de Wall Street ?",
                options: [
                    "Le jeudi noir (24 octobre 1929)",
                    "Le lundi noir (19 octobre 1987)",
                    "Le vendredi noir (25 septembre 2008)",
                    "Le mardi noir (29 octobre 1929)"
                ],
                correct: 0,
                explanation: "Le jeudi noir, 24 octobre 1929, marque le début du krach boursier à Wall Street. Le mardi noir (29 octobre) a aggravé la chute."
            },
            {
                theme: "crise",
                type: "tf",
                question: "L'Allemagne a été particulièrement touchée par la crise de 1929.",
                correct: true,
                explanation: "Vrai. L'Allemagne a été durement touchée avec 6 millions de chômeurs en 1932, ce qui a favorisé la montée du nazisme."
            },

            // Front Populaire
            {
                theme: "france",
                type: "mcq",
                question: "Qui était le chef du gouvernement du Front Populaire ?",
                options: [
                    "Georges Clemenceau",
                    "Léon Blum",
                    "Édouard Daladier",
                    "Pierre Laval"
                ],
                correct: 1,
                explanation: "Léon Blum (socialiste) est devenu président du Conseil en 1936 après la victoire du Front Populaire."
            },
            {
                theme: "france",
                type: "tf",
                question: "Les congés payés ont été instaurés par le Front Populaire en 1936.",
                correct: true,
                explanation: "Vrai. Les accords de Matignon (juin 1936) ont instauré deux semaines de congés payés, une première en France."
            },
            {
                theme: "france",
                type: "mcq",
                question: "Quelle était la durée de la semaine de travail après les réformes du Front Populaire ?",
                options: ["35 heures", "39 heures", "40 heures", "48 heures"],
                correct: 2,
                explanation: "Le Front Populaire a instauré la semaine de 40 heures, alors qu'auparavant elle était de 48 heures."
            },

            // Italie fasciste
            {
                theme: "italie",
                type: "mcq",
                question: "En quelle année Mussolini est-il arrivé au pouvoir ?",
                options: ["1920", "1922", "1924", "1926"],
                correct: 1,
                explanation: "Mussolini est arrivé au pouvoir en octobre 1922 après la Marche sur Rome, devenant chef du gouvernement."
            },
            {
                theme: "italie",
                type: "input",
                question: "Comment Mussolini se faisait-il appeler (titre italien signifiant 'le chef') ?",
                correct: ["duce", "le duce"],
                explanation: "Mussolini portait le titre de Duce, qui signifie 'le chef' ou 'le guide' en italien."
            },

            // Montée des périls
            {
                theme: "perils",
                type: "mcq",
                question: "Quelle alliance a été signée le 23 août 1939 entre l'Allemagne et l'URSS ?",
                options: [
                    "Le Pacte d'Acier",
                    "Le Pacte germano-soviétique",
                    "Le Pacte anti-Komintern",
                    "L'Axe Rome-Berlin"
                ],
                correct: 1,
                explanation: "Le Pacte germano-soviétique (23 août 1939) était un pacte de non-agression surprenant entre deux régimes opposés, avec une clause secrète de partage de la Pologne."
            },
            {
                theme: "perils",
                type: "mcq",
                question: "Qu'appelle-t-on l'Anschluss ?",
                options: [
                    "L'invasion de la Pologne",
                    "L'annexion de l'Autriche",
                    "La réoccupation de la Rhénanie",
                    "L'annexion des Sudètes"
                ],
                correct: 1,
                explanation: "L'Anschluss (mars 1938) est l'annexion de l'Autriche par l'Allemagne nazie, réalisant l'union des peuples germaniques."
            },
            {
                theme: "perils",
                type: "tf",
                question: "Le Pacte d'Acier a été signé entre l'Allemagne et l'Italie le 22 mai 1939.",
                correct: true,
                explanation: "Vrai. Le Pacte d'Acier (22 mai 1939) était une alliance militaire entre l'Allemagne et l'Italie."
            },
            {
                theme: "perils",
                type: "mcq",
                question: "Quel événement marque le début de la Seconde Guerre Mondiale ?",
                options: [
                    "L'annexion de l'Autriche",
                    "L'invasion de la Pologne",
                    "L'invasion de la France",
                    "L'attaque de Pearl Harbor"
                ],
                correct: 1,
                explanation: "L'invasion de la Pologne par l'Allemagne le 1er septembre 1939 marque le début de la Seconde Guerre Mondiale. La France et le Royaume-Uni déclarent la guerre à l'Allemagne le 3 septembre."
            }
        ];

        let selectedThemes = new Set(['all']);
        let currentQuestions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let userAnswers = [];

        // Gestion de la sélection des thèmes
        document.getElementById('themeSelector').addEventListener('click', (e) => {
            if (e.target.classList.contains('theme-btn')) {
                const theme = e.target.dataset.theme;
                
                if (theme === 'all') {
                    selectedThemes.clear();
                    selectedThemes.add('all');
                    document.querySelectorAll('.theme-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    e.target.classList.add('active');
                } else {
                    selectedThemes.delete('all');
                    document.querySelector('[data-theme="all"]').classList.remove('active');
                    
                    if (selectedThemes.has(theme)) {
                        selectedThemes.delete(theme);
                        e.target.classList.remove('active');
                    } else {
                        selectedThemes.add(theme);
                        e.target.classList.add('active');
                    }
                    
                    if (selectedThemes.size === 0) {
                        selectedThemes.add('all');
                        document.querySelector('[data-theme="all"]').classList.add('active');
                    }
                }
            }
        });

        function startQuiz() {
            // Filtrer les questions selon les thèmes sélectionnés
            if (selectedThemes.has('all')) {
                currentQuestions = [...questions];
            } else {
                currentQuestions = questions.filter(q => selectedThemes.has(q.theme));
            }

            // Mélanger les questions
            currentQuestions.sort(() => Math.random() - 0.5);
            
            // Limiter à 20 questions max
            currentQuestions = currentQuestions.slice(0, Math.min(20, currentQuestions.length));

            currentQuestionIndex = 0;
            score = 0;
            userAnswers = [];

            document.querySelector('.start-screen').classList.remove('active');
            document.querySelector('.quiz-screen').classList.add('active');

            showQuestion();
        }

        function showQuestion() {
            const question = currentQuestions[currentQuestionIndex];
            const questionCard = document.getElementById('questionCard');
            
            let html = `
                <div class="question-number">Question ${currentQuestionIndex + 1}/${currentQuestions.length}</div>
                <div class="question-text">${question.question}</div>
            `;

            if (question.type === 'mcq') {
                html += '<div class="options">';
                question.options.forEach((option, index) => {
                    html += `<div class="option" data-index="${index}">${option}</div>`;
                });
                html += '</div>';
            } else if (question.type === 'tf') {
                html += `
                    <div class="options">
                        <div class="option" data-answer="true">Vrai</div>
                        <div class="option" data-answer="false">Faux</div>
                    </div>
                `;
            } else if (question.type === 'input') {
                html += '<input type="text" class="input-answer" placeholder="Écris ta réponse ici..." />';
            }

            html += '<div class="explanation" id="explanation"></div>';

            questionCard.innerHTML = html;

            // Ajouter les événements de clic sur les options
            document.querySelectorAll('.option').forEach(option => {
                option.addEventListener('click', () => {
                    document.querySelectorAll('.option').forEach(opt => opt.classList.remove('selected'));
                    option.classList.add('selected');
                    document.getElementById('submitBtn').style.display = 'block';
                });
            });

            // Pour les questions à saisie
            const inputAnswer = document.querySelector('.input-answer');
            if (inputAnswer) {
                inputAnswer.addEventListener('input', () => {
                    document.getElementById('submitBtn').style.display = 'block';
                });
            }

            updateProgress();
            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'none';
        }

        function submitAnswer() {
            const question = currentQuestions[currentQuestionIndex];
            let userAnswer = null;
            let isCorrect = false;

            if (question.type === 'mcq') {
                const selected = document.querySelector('.option.selected');
                if (!selected) return;
                
                userAnswer = parseInt(selected.dataset.index);
                isCorrect = userAnswer === question.correct;
                
                document.querySelectorAll('.option').forEach((option, index) => {
                    option.style.pointerEvents = 'none';
                    if (index === question.correct) {
                        option.classList.add('correct');
                    } else if (index === userAnswer && !isCorrect) {
                        option.classList.add('incorrect');
                    }
                });
            } else if (question.type === 'tf') {
                const selected = document.querySelector('.option.selected');
                if (!selected) return;
                
                userAnswer = selected.dataset.answer === 'true';
                isCorrect = userAnswer === question.correct;
                
                document.querySelectorAll('.option').forEach(option => {
                    option.style.pointerEvents = 'none';
                    const optAnswer = option.dataset.answer === 'true';
                    if (optAnswer === question.correct) {
                        option.classList.add('correct');
                    } else if (optAnswer === userAnswer && !isCorrect) {
                        option.classList.add('incorrect');
                    }
                });
            } else if (question.type === 'input') {
                const input = document.querySelector('.input-answer');
                userAnswer = input.value.trim().toLowerCase();
                
                isCorrect = question.correct.some(answer => 
                    userAnswer === answer.toLowerCase()
                );
                
                input.disabled = true;
                input.style.borderColor = isCorrect ? '#4caf50' : '#f44336';
                input.style.background = isCorrect ? '#c8e6c9' : '#ffcdd2';
            }

            if (isCorrect) {
                score++;
            }

            userAnswers.push({
                question: question.question,
                userAnswer: userAnswer,
                correct: question.correct,
                isCorrect: isCorrect,
                explanation: question.explanation,
                type: question.type,
                options: question.options
            });

            // Afficher l'explication
            const explanation = document.getElementById('explanation');
            explanation.innerHTML = `
                <div class="explanation-title">${isCorrect ? '✅ Bonne réponse !' : '❌ Réponse incorrecte'}</div>
                <div class="explanation-text">${question.explanation}</div>
            `;
            explanation.classList.add('show');

            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('nextBtn').style.display = 'block';

            updateProgress();
        }

        function nextQuestion() {
            currentQuestionIndex++;
            
            if (currentQuestionIndex < currentQuestions.length) {
                showQuestion();
            } else {
                showResults();
            }
        }

        function updateProgress() {
            document.getElementById('progressText').textContent = 
                `Question ${currentQuestionIndex + 1}/${currentQuestions.length}`;
            document.getElementById('scoreText').textContent = `Score: ${score}/${currentQuestionIndex}`;
            
            const progress = ((currentQuestionIndex + 1) / currentQuestions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function showResults() {
            document.querySelector('.quiz-screen').classList.remove('active');
            document.querySelector('.results-screen').classList.add('active');

            const percentage = Math.round((score / currentQuestions.length) * 100);
            
            const scoreCircle = document.getElementById('scoreCircle');
            scoreCircle.textContent = percentage + '%';
            
            if (percentage >= 80) {
                scoreCircle.className = 'score-circle score-excellent';
                document.getElementById('scoreMessage').textContent = 
                    '🎉 Excellent ! Tu maîtrises très bien ton cours !';
            } else if (percentage >= 60) {
                scoreCircle.className = 'score-circle score-good';
                document.getElementById('scoreMessage').textContent = 
                    '👍 Bien joué ! Continue comme ça !';
            } else if (percentage >= 40) {
                scoreCircle.className = 'score-circle score-average';
                document.getElementById('scoreMessage').textContent = 
                    '📚 Pas mal ! Mais il faut encore réviser un peu.';
            } else {
                scoreCircle.className = 'score-circle score-low';
                document.getElementById('scoreMessage').textContent = 
                    '💪 Courage ! Retourne voir tes fiches et réessaye !';
            }

            document.getElementById('scoreTextResult').textContent = 
                `Score: ${score}/${currentQuestions.length}`;

            // Afficher la révision des réponses
            let reviewHTML = '<h3 style="color: #1F4788; margin-bottom: 20px;">📝 Révision de tes réponses</h3>';
            
            userAnswers.forEach((answer, index) => {
                reviewHTML += `
                    <div class="review-item">
                        <div class="review-question">Question ${index + 1}: ${answer.question}</div>
                        <div class="review-answer ${answer.isCorrect ? 'review-correct' : 'review-incorrect'}">
                            ${answer.isCorrect ? '✅' : '❌'} ${getAnswerText(answer)}
                        </div>
                        <div style="margin-top: 10px; color: #666;">${answer.explanation}</div>
                    </div>
                `;
            });

            document.getElementById('reviewSection').innerHTML = reviewHTML;
        }

        function getAnswerText(answer) {
            if (answer.type === 'mcq') {
                return `Ta réponse: ${answer.options[answer.userAnswer]}${!answer.isCorrect ? ` | Bonne réponse: ${answer.options[answer.correct]}` : ''}`;
            } else if (answer.type === 'tf') {
                return `Ta réponse: ${answer.userAnswer ? 'Vrai' : 'Faux'}${!answer.isCorrect ? ` | Bonne réponse: ${answer.correct ? 'Vrai' : 'Faux'}` : ''}`;
            } else if (answer.type === 'input') {
                return `Ta réponse: ${answer.userAnswer}${!answer.isCorrect ? ` | Réponse attendue: ${answer.correct[0]}` : ''}`;
            }
        }

        function restartQuiz() {
            document.querySelector('.results-screen').classList.remove('active');
            document.querySelector('.start-screen').classList.add('active');
        }
    </script>
</body>
</html>
